<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%224%22/%3E%3Ccircle cx=%228%22 cy=%228%22 r=%223.5%22 fill=%22white%22/%3E%3C/svg%3E">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aronica · Ops</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="/css/app.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <style>
    .ops { display: grid; grid-template-columns: 1fr 420px; grid-template-rows: auto 1fr; height: 100vh; }
    .ops header { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; padding: 12px 18px; border-bottom: 1px solid var(--line); }
    .ops main { overflow-y: auto; padding: 16px 18px; display: flex; flex-direction: column; gap: 18px; }
    .ops aside { border-left: 1px solid var(--line); display: grid; grid-template-rows: 300px 1fr; min-height: 0; }
    .ops aside .mapbox { position: relative; }
    .ops .log { overflow-y: auto; font-size: 12px; padding: 8px 12px; }
    .ops .log div { padding: 4px 0; border-bottom: 1px solid var(--line); display: flex; gap: 8px; }
    .ops .log .t { color: var(--fg-3); font-family: var(--mono); flex: none; }
    .ops .log .ty { font-family: var(--mono); font-weight: 600; flex: none; }
    .kpis { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
    .tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
    @media (max-width: 1000px) { .ops { grid-template-columns: 1fr; height: auto; } .ops aside { border-left: 0; grid-template-rows: 300px 400px; } .kpis { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
  <div class="ops">
    <header>
      <div class="row"><a href="/" class="logo" style="text-decoration:none"><i></i>Aronica</a><span class="badge dark">Ops · Milano</span></div>
      <div class="row small" id="settings"></div>
    </header>
    <main id="main"></main>
    <aside>
      <div class="mapbox"><div id="map" class="map"></div></div>
      <div class="log" id="log"></div>
    </aside>
  </div>
  <script type="module" src="/js/ops.js"></script>
</body>
</html>
