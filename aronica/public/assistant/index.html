<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%224%22 fill=%22%235b5bd6%22/%3E%3Cpath d=%22M5 8h6M8 5v6%22 stroke=%22white%22 stroke-width=%221.6%22 stroke-linecap=%22round%22/%3E%3C/svg%3E">
  <title>Assistente (simulato) · Aronica</title>
  <link rel="stylesheet" href="/shared/app.css">
  <link rel="stylesheet" href="/assistant/assistant.css">
</head>
<body>
  <div class="as-shell">
    <header class="as-top">
      <div class="as-id"><span class="as-dot"></span><div><b>Assistente</b><div class="xs faint">Simulato · un agente scriptato, nessun LLM</div></div></div>
      <a class="xs muted" href="/">Cos'è?</a>
    </header>
    <main class="as-chat" id="chat" aria-live="polite"></main>
    <footer class="as-foot">
      <div class="chips as-sugg" id="sugg"></div>
      <form class="as-input" id="form">
        <textarea id="text" rows="1" placeholder="Chiedi qualcosa al tuo assistente…" aria-label="Messaggio"></textarea>
        <button class="btn primary" id="send" aria-label="Invia">Invia</button>
      </form>
    </footer>
  </div>
  <script type="module">
    import { mountAssistant } from '/assistant/app.js';
    mountAssistant();
  </script>
</body>
</html>
